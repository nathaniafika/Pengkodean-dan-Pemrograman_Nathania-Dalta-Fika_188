<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center">Inventory Management</h2>

        <!-- Form Tambah Item -->
        <div class="card p-3 mt-3">
            <h4>Tambah Item Baru</h4>
            <input type="text" id="name" class="form-control my-2" placeholder="Nama Item">
            <input type="number" id="quantity" class="form-control my-2" placeholder="Jumlah">
            <input type="number" id="price" class="form-control my-2" placeholder="Harga">
            <button class="btn btn-primary" onclick="addItem()">Tambah</button>
        </div>

        <!-- Tabel Inventory -->
        <div class="card p-3 mt-4">
            <h4>Daftar Item</h4>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Item</th>
                        <th>Jumlah</th>
                        <th>Harga</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="inventory-table">
                    <!-- Data dari database akan masuk ke sini -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Ambil data dari database
        function fetchItems() {
            $.ajax({
                url: "fetch_items.php",
                method: "GET",
                success: function(response) {
                    let html = "";
                    response.forEach(item => {
                        html += `
                            <tr>
                                <td>${item.id}</td>
                                <td>${item.name}</td>
                                <td>${item.quantity}</td>
                                <td>Rp${item.price.toFixed(2)}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">Hapus</button>
                                </td>
                            </tr>
                        `;
                    });
                    $("#inventory-table").html(html);
                },
                error: function() {
                    console.log("Gagal mengambil data");
                }
            });
        }

        // Tambah item baru
        function addItem() {
            let name = $("#name").val();
            let quantity = $("#quantity").val();
            let price = $("#price").val();

            $.post("add_item.php", { name, quantity, price }, function(response) {
                alert(response);
                fetchItems();
            });
        }

        // Hapus item
        function deleteItem(id) {
            $.post("delete_item.php", { id }, function(response) {
                alert(response);
                fetchItems();
            });
        }

        // Load data saat halaman dibuka
        $(document).ready(function() {
            fetchItems();
        });
    </script>

</body>
</html>
